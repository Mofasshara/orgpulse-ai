[project]
name = "orgpulse"
version = "0.1.0"
description = "Autonomous pharma-ops organizational intelligence platform"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "typer>=0.12",
    "scikit-learn>=1.4",
    "prophet>=1.1",
    "langgraph>=0.2",
    "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
orgpulse = "orgpulse.cli:app"

[project.optional-dependencies]
dashboard = [
    "plotly>=5.20",
    "streamlit>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgpulse"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
